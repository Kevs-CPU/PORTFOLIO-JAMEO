name: flutter_portfolio_clean_architecture

description: A new Flutter project.

publish_to: none

version: 1.0.0+1

environment:
  sdk: '>=3.0.6 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.2
  provider: ^6.1.2

  # Activity 2: Monitor Wi-Fi, Cellular, and Offline network changes
  connectivity_plus: ^6.1.5

  # Activity 3: Actual network measurement
  http: ^1.5.0

  file_picker: ^13.1.0

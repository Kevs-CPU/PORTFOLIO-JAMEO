  # Activity 4: Local Mesh Chat
  nearby_connections:
    path: packages/nearby_connections

  permission_handler: 12.0.3

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^2.0.0

flutter:
  uses-material-design: true